[loggers]
keys=root,console,file

[handlers]
keys=consoleHandler,fileHandler

[formatters]
keys=commonFormatter

[logger_root]
level=DEBUG
handlers=consoleHandler, fileHandler

[logger_console]
level=INFO
handlers=consoleHandler
qualname=console

[logger_file]
level=DEBUG
handlers=fileHandler
qualname=file

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=commonFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=FileHandler
level=DEBUG
formatter=commonFormatter
args=('C:\PycharmProjects\python-autotests-basic\python-autotests-basic\module_6\Practice_6\log.txt', 'w')

[formatter_commonFormatter]
format=[%(asctime)s][%(levelname)s][%(filename)s] %(message)s
datefmt=